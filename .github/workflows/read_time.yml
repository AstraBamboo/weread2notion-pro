name: read time sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check APIs and existing databases; do not write"
        type: boolean
        default: true
  schedule:
    - cron: "0 5,15 * * 0"  # Sunday 13:00 and 23:00 Asia/Shanghai
concurrency:
  group: weread-notion-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
      HEATMAP_BLOCK_ID: ${{ secrets.HEATMAP_BLOCK_ID }}
      BOOK_DATABASE_NAME: ${{ vars.BOOK_DATABASE_NAME }}
      AUTHOR_DATABASE_NAME: ${{ vars.AUTHOR_DATABASE_NAME }}
      CATEGORY_DATABASE_NAME: ${{ vars.CATEGORY_DATABASE_NAME }}
      BOOKMARK_DATABASE_NAME: ${{ vars.BOOKMARK_DATABASE_NAME }}
      REVIEW_DATABASE_NAME: ${{ vars.REVIEW_DATABASE_NAME }}
      CHAPTER_DATABASE_NAME: ${{ vars.CHAPTER_DATABASE_NAME }}
      YEAR_DATABASE_NAME: ${{ vars.YEAR_DATABASE_NAME }}
      WEEK_DATABASE_NAME: ${{ vars.WEEK_DATABASE_NAME }}
      MONTH_DATABASE_NAME: ${{ vars.MONTH_DATABASE_NAME }}
      DAY_DATABASE_NAME: ${{ vars.DAY_DATABASE_NAME }}
      REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      YEAR: ${{ vars.YEAR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Read-only preflight
        run: python -m weread2notionpro.preflight daily
      - name: read time sync
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          read_time
      
